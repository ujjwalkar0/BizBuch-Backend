services:
  web:
    image: ujjwalkar/bizbuch-backend:latest
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn mysite.wsgi:application --bind 0.0.0.0:8000
      "
    ports:
      - "8000:8000"   # ✅ only required exposed port
    environment:
      - DEBUG=True
      - OTP_VERIFICATION_ENABLED=False

      # Postgres
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_DB=bizbuch
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

      # Redis
      - REDIS_HOST=redis

      # S3 (MinIO)
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_S3_BUCKET=bizbuch
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_S3_USE_SSL=False

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      minio_init:
        condition: service_completed_successfully

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: bizbuch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bizbuch"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

    # Optional: expose MinIO ports only if needed for UI/debugging
    # ports:
    #   - "9000:9000"
    #   - "9001:9001"

  minio_init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin) do sleep 2; done;
      /usr/bin/mc mb -p myminio/bizbuch || true;
      /usr/bin/mc anonymous set download myminio/bizbuch || true;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
